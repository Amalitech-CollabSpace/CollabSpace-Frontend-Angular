<div class="p-6">
  <div class="max-w-2xl mx-auto">
    <div class="flex items-center mb-6">
      <a routerLink="/projects" class="text-gray-400 hover:text-gray-600 mr-4">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7" />
        </svg>
      </a>
      <h1 class="text-3xl font-bold text-gray-900">{{ pageTitle() }}</h1>
    </div>

    <form (ngSubmit)="onSubmit()" class="space-y-6">
      <div>
        <label for="name" class="block text-sm font-medium text-gray-700 mb-2">Project Name</label>
        <input 
          type="text" 
          id="name"
          [ngModel]="formData().name"
          (ngModelChange)="updateName($event)"
          name="name"
          required
          class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent">
      </div>

      <div>
        <label for="description" class="block text-sm font-medium text-gray-700 mb-2">Description</label>
        <textarea 
          id="description"
          [ngModel]="formData().description"
          (ngModelChange)="updateDescription($event)"
          name="description"
          rows="4"
          class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent"></textarea>
      </div>

      @if (!isEditing()) {
        <div>
          <label for="owner" class="block text-sm font-medium text-gray-700 mb-2">Owner</label>
          <input 
            type="email" 
            id="owner"
            [ngModel]="formData().owner"
            (ngModelChange)="updateOwner($event)"
            name="owner"
            required
            class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent">
        </div>
      }

      <div>
        <label class="block text-sm font-medium text-gray-700 mb-2">Members</label>
        <div class="space-y-2">
          @for (member of formData().members; track member) {
            <div class="flex items-center justify-between bg-gray-50 px-3 py-2 rounded">
              <span class="text-sm">{{ member }}</span>
              <button 
                type="button"
                (click)="removeMember(member)"
                class="text-red-600 hover:text-red-800">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
                </svg>
              </button>
            </div>
          }
          <button 
            type="button"
            (click)="addMember()"
            class="text-blue-600 hover:text-blue-800 text-sm font-medium">
            + Add Member
          </button>
        </div>
      </div>

      <div class="flex justify-end space-x-3">
        <button 
          type="button"
          (click)="onCancel()"
          class="px-4 py-2 text-gray-600 hover:text-gray-800 font-medium">
          Cancel
        </button>
        <button 
          type="submit"
          class="px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white font-medium rounded-lg transition-colors">
          {{ isEditing() ? "Update" : "Create" }} Project
        </button>
      </div>
    </form>
  </div>
</div>
