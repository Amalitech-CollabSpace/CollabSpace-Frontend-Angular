<div
  class="bg-white rounded-xl shadow-sm border border-slate-100 hover:shadow-md transition-shadow duration-200"
>
<div class=" p-6 border-b border-slate-200">


  <div class="flex justify-between items-start">
    <div>
      <h3 class="text-gray-800 font-semibold text-lg">{{ title() }}</h3>
      <p class="text-gray-500 text-sm">{{ company() }}</p>
    </div>

    <div class="relative w-10 h-10">
      <svg class="w-full h-full transform -rotate-90">
        <circle
          cx="20"
          cy="20"
          r="18"
          stroke="#E5E7EB"
          stroke-width="4"
          fill="none"
        ></circle>
        <circle
          cx="20"
          cy="20"
          r="18"
          stroke="#22C55E"
          stroke-width="4"
          fill="none"
          [attr.stroke-dasharray]="2 * pi * 18"
          [attr.stroke-dashoffset]="progressOffset"
          stroke-linecap="round"
        ></circle>
      </svg>
      <span
        class="absolute inset-0 flex items-center justify-center text-[10px] font-semibold text-gray-800"
        >{{ progress() }}%</span
      >
    </div>
  </div>

  
  <div class="flex justify-between items-center text-sm mt-4 text-gray-500">
    <div class="flex items-center gap-1">
      <span>
        <ng-icon name="bootstrapCheck2Circle" />
      </span>
      <span>{{ tasksLeft() }} Tasks Left</span>
    </div>
    <div class="flex items-center gap-1 text-red-500">
      <span>
        <ng-icon name="bootstrapAlarm" />
      </span>
      <span>{{ overdue() }} Overdue</span>
    </div>
  </div>


  <div class="flex items-center mt-3">
    <div class="flex -space-x-2">
      <div class="flex -space-x-2">
        @for (member of members(); track member) {
        <img
          class="w-8 h-8 rounded-full border-2 border-white"
          [src]="member"
          alt="member"
        />
        }
      </div>
    </div>
    <span class="ml-auto text-xs text-amber-500 font-medium">
      Due in {{ dueIn() }}
    </span>
  </div>

 </div>
 <div class="p-6">

     <a
     [routerLink]="link()"
     class="block text-blue-500 text-sm font-medium hover:underline"
     >
     View Project
    </a>
</div>
</div>
