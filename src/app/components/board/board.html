<div class="flex gap-4 overflow-x-auto p-4 h-[90vh] bg-gray-100">
  @for (list of lists(); track list.id) {
    <app-board-list
      [list]="list"
      (dragStart)="onDragStart($event.task, $event.listId)"
      (dropTask)="onDrop($event)"
    />
  }


  <button
    (click)="addList()"
    class="min-w-[200px] h-fit self-start bg-white border-2 border-dashed border-gray-300 rounded-xl p-4 text-gray-500 hover:bg-gray-50"
  >
    + Add List
  </button>
</div>
