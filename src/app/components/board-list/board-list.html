<div
  class="bg-white rounded-xl shadow-md p-4 w-[260px] flex flex-col gap-3"
  (dragover)="onDragOver($event)"
  (drop)="onDrop()"
>
  <div class="flex justify-between items-center font-semibold text-gray-700">
    <span>{{ list().title }}</span>
    <button (click)="addTask()" class="text-sm text-blue-500 hover:underline">
      + Add
    </button>
  </div>

  <div class="flex flex-col gap-2">
    @if (list().tasks.length === 0) {
      <p class="text-gray-400 text-sm italic">No tasks yet</p>
    } @else {
      @for (task of list().tasks; track task.id) {
        <div
          draggable="true"
          (dragstart)="onDragStart(task)"
          class="p-3 bg-gray-50 border border-gray-200 rounded-lg cursor-grab hover:bg-gray-100"
        >
          {{ task.title }}
        </div>
      }
    }
  </div>
</div>
