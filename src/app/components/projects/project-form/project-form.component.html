<div class="container mx-auto px-4 py-8 max-w-2xl">
  <div class="mb-6">
    <button 
      class="text-blue-600 hover:text-blue-800 mb-4"
      routerLink="/dashboard/projects">
      ← Back to Projects
    </button>
    <h1 class="text-3xl font-bold text-gray-900">{{ isEditMode ? 'Edit Project' : 'Create Project' }}</h1>
  </div>

  <!-- Loading State -->
  <div *ngIf="isLoading" class="flex justify-center items-center py-12">
    <div class="text-gray-500">Loading project...</div>
  </div>

  <!-- Error State -->
  <div *ngIf="error && !isLoading" class="bg-red-50 border border-red-200 rounded-lg p-4 mb-4">
    <p class="text-red-800">{{ error }}</p>
  </div>
  
  <div class="bg-white rounded-lg shadow-md p-6">
    <form [formGroup]="projectForm" (ngSubmit)="onSubmit()" class="space-y-4">
      <div>
        <app-input-component 
          [controlName]="$any(projectForm.get('name'))" 
          [label]="'Project Name'" 
          [type]="'text'">
        </app-input-component>
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-2">Description</label>
        <textarea 
          formControlName="description"
          placeholder="Enter project description"
          rows="4"
          class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"></textarea>
      </div>
      <div class="grid grid-cols-2 gap-4">
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-2">Start Date</label>
          <input
            type="date"
            formControlName="start_date"
            class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
            [class.border-red-500]="projectForm.get('start_date')?.invalid && projectForm.get('start_date')?.touched">
          <p *ngIf="projectForm.get('start_date')?.invalid && projectForm.get('start_date')?.touched" class="text-red-500 text-xs mt-1">
            Start date is required
          </p>
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-2">End Date</label>
          <input
            type="date"
            formControlName="end_date"
            class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
            [class.border-red-500]="projectForm.get('end_date')?.invalid && projectForm.get('end_date')?.touched">
          <p *ngIf="projectForm.get('end_date')?.invalid && projectForm.get('end_date')?.touched" class="text-red-500 text-xs mt-1">
            End date is required
          </p>
        </div>
      </div>
      <div class="flex gap-4 pt-4">
        <button 
          type="button"
          (click)="onCancel()"
          [disabled]="isSubmitting"
          class="px-4 py-2 border border-gray-300 rounded-lg hover:bg-gray-50 disabled:bg-gray-100 disabled:cursor-not-allowed">
          Cancel
        </button>
        <button 
          type="submit"
          [disabled]="projectForm.invalid || isSubmitting"
          class="px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 disabled:bg-gray-400 disabled:cursor-not-allowed">
          <span *ngIf="!isSubmitting">{{ isEditMode ? 'Update' : 'Create' }} Project</span>
          <span *ngIf="isSubmitting">Saving...</span>
        </button>
      </div>
    </form>
  </div>
</div>
