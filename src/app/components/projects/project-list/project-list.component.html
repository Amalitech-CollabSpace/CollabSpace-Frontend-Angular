<div class="container mx-auto px-4 py-8">
  <div class="flex justify-between items-center mb-6">
    <h1 class="text-3xl font-bold text-gray-900">Projects</h1>
    <button 
      class="bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2 px-4 rounded-lg transition-colors"
      routerLink="/dashboard/projects/create">
      Create Project
    </button>
  </div>
  
  <!-- Loading State -->
  <div *ngIf="isLoading" class="flex justify-center items-center py-12">
    <div class="text-gray-500">Loading projects...</div>
  </div>

  <!-- Error State -->
  <div *ngIf="error && !isLoading" class="bg-red-50 border border-red-200 rounded-lg p-4 mb-4">
    <p class="text-red-800">{{ error }}</p>
    <button 
      (click)="loadProjects()"
      class="mt-2 text-red-600 hover:text-red-800 underline">
      Retry
    </button>
  </div>

  <!-- Projects Grid -->
  <div *ngIf="!isLoading && !error" class="grid gap-4 md:grid-cols-2 lg:grid-cols-3">
    <!-- Project Cards -->
    <div 
      *ngFor="let project of projects"
      class="bg-white rounded-lg shadow-md p-6 border border-gray-200 hover:shadow-lg transition-shadow cursor-pointer"
      [routerLink]="['/dashboard/projects', project.id]">
      <div class="flex justify-between items-start mb-3">
        <h3 class="text-lg font-semibold text-gray-900">{{ project.name }}</h3>
        <span 
          class="px-2 py-1 text-xs rounded-full"
          [ngClass]="{
            'bg-green-100 text-green-800': project.status === 'ACTIVE',
            'bg-gray-100 text-gray-800': project.status === 'COMPLETED',
            'bg-yellow-100 text-yellow-800': project.status === 'ARCHIVED'
          }">
          {{ project.status }}
        </span>
      </div>
      <p class="text-gray-600 text-sm mb-4 line-clamp-2">{{ project.description || 'No description' }}</p>
      <div class="text-xs text-gray-500">
        <div>Start: {{ project.startDate | date:'short' }}</div>
        <div>End: {{ project.endDate | date:'short' }}</div>
      </div>
    </div>
  </div>

  <!-- Empty State -->
  <div *ngIf="!isLoading && !error && projects.length === 0" class="text-center py-12">
    <div class="bg-gray-50 rounded-lg p-8 border border-gray-200">
      <p class="text-gray-500 text-lg mb-2">No projects found</p>
      <p class="text-gray-400 text-sm mb-4">Get started by creating your first project</p>
      <button 
        class="bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2 px-4 rounded-lg transition-colors"
        routerLink="/dashboard/projects/create">
        Create Project
      </button>
    </div>
  </div>
</div>
