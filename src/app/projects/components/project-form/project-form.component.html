<div class="container mx-auto px-4 py-8 max-w-2xl">
  <div class="mb-6">
    <button 
      class="text-blue-600 hover:text-blue-800 mb-4"
      routerLink="/projects">
      ← Back to Projects
    </button>
    <h1 class="text-3xl font-bold text-gray-900">Create Project</h1>
  </div>
  
  <div class="bg-white rounded-lg shadow-md p-6">
    <form [formGroup]="projectForm" (ngSubmit)="onSubmit()" class="space-y-4">
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-2">Project Name</label>
        <input 
          type="text" 
          formControlName="name"
          placeholder="Enter project name"
          class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
        <div *ngIf="projectForm.get('name')?.invalid && projectForm.get('name')?.touched" 
             class="text-red-500 text-sm mt-1">
          Project name is required
        </div>
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-2">Description</label>
        <textarea 
          formControlName="description"
          placeholder="Enter project description"
          rows="4"
          class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"></textarea>
      </div>
      <div class="flex gap-4 pt-4">
        <button 
          type="button"
          class="px-4 py-2 border border-gray-300 rounded-lg hover:bg-gray-50">
          Cancel
        </button>
        <button 
          type="submit"
          [disabled]="projectForm.invalid"
          class="px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 disabled:bg-gray-400 disabled:cursor-not-allowed">
          Save Project
        </button>
      </div>
    </form>
  </div>
</div>
