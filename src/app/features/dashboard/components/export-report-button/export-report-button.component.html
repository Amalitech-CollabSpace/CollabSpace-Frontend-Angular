<div class="relative">
  <button
    type="button"
    (click)="toggleDropdown()"
    [disabled]="isLoading()"
    class="flex items-center gap-2 px-4 py-2 bg-blue-500 text-white rounded-lg hover:bg-blue-600 transition-colors disabled:opacity-50 disabled:cursor-not-allowed font-medium shadow-sm"
  >
    <ng-icon name="heroArrowDownTray" class="w-5 h-5" />
    <span>Export Report</span>
    <ng-icon name="heroChevronDown" class="w-4 h-4" />
  </button>

  @if (isDropdownOpen()) {
    <div
      class="absolute right-0 mt-2 w-48 bg-white rounded-lg shadow-lg border border-gray-200 z-50"
    >
      <div class="py-1">
        <button
          type="button"
          (click)="exportReport('csv')"
          [disabled]="isLoading()"
          class="w-full flex items-center gap-3 px-4 py-2 text-left text-gray-700 hover:bg-gray-100 transition-colors disabled:opacity-50 disabled:cursor-not-allowed"
        >
          <ng-icon name="heroDocumentText" class="w-5 h-5 text-green-600" />
          <span class="font-medium">Export as CSV</span>
        </button>
        <button
          type="button"
          (click)="exportReport('pdf')"
          [disabled]="isLoading()"
          class="w-full flex items-center gap-3 px-4 py-2 text-left text-gray-700 hover:bg-gray-100 transition-colors disabled:opacity-50 disabled:cursor-not-allowed"
        >
          <ng-icon name="heroDocumentArrowDown" class="w-5 h-5 text-red-600" />
          <span class="font-medium">Export as PDF</span>
        </button>
      </div>
    </div>
  }
</div>
