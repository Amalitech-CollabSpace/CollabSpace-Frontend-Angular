<div class="h-[90vh] px-8 py-6 overflow-y-auto">
  <form
    [formGroup]="taskForm"
    class="max-w-4xl mx-auto p-6 bg-white rounded-xl shadow-sm space-y-6"
  >
    <div class="flex flex-col items-start">
      <label for="" class="text-lg font-medium mb-2"
        >Title <span class="text-red-400">*</span></label
      >
      <input
        formControlName="title"
        placeholder="Task title"
        type="text"
        class="placeholder:text-slate-400 placeholder:text-[14px] placeholder:italic w-full rounded-md border border-gray-300 p-3 focus:outline-none focus:ring-2 focus:ring-blue-400"
      />
    </div>

    <div>
      <label class="text-lg font-medium mb-2"
        >Description <span class="text-red-400">*</span></label
      >
      <textarea
        formControlName="description"
        rows="5"
        placeholder="Describe the goal of this task..."
        class="placeholder:text-slate-400 placeholder:text-[14px] placeholder:italic w-full rounded-md border border-gray-300 p-3 focus:outline-none focus:ring-2 focus:ring-blue-400"
      ></textarea>
    </div>

    <div
      class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 items-center gap-2"
    >
      <div class="flex flex-col">
        <label for="" class="text-lg font-medium mb-2">Assignee</label>
        <select
          formControlName="assigneeId"
          name="assigneeId"
          id=""
          class="placeholder:text-slate-400 placeholder:text-[14px] placeholder:italic w-full rounded-md border border-gray-300 p-3 focus:outline-none focus:ring-2 focus:ring-blue-400"
        >
          <option value="" selected disabled hidden>Assign a member</option>
          <option value="Desmond">Desmond</option>
          <option value="Selina">Selina</option>
          <option value="Jesse">Jesse</option>
          <option value="Nobody">Nobody</option>
        </select>
      </div>
      <div class="flex flex-col">
        <label for="" class="text-lg font-medium mb-2">Priority</label>
        <select
          formControlName="priority"
          name=""
          id=""
          class="placeholder:text-slate-400 placeholder:text-[14px] placeholder:italic w-full rounded-md border border-gray-300 p-3 focus:outline-none focus:ring-2 focus:ring-blue-400"
        >
          <option value="" selected disabled hidden>Set priority</option>
          <option value="HIGH">High</option>
          <option value="MEDIUM">Medium</option>
          <option value="LOW">Low</option>
        </select>
      </div>
      <div class="flex flex-col">
        <label for="" class="text-lg font-medium mb-2">Due Date</label>
        <input
          formControlName="dueDate"
          type="date"
          name=""
          id=""
          class="placeholder:text-slate-400 placeholder:text-[14px] placeholder:italic w-full rounded-md border border-gray-300 p-3 focus:outline-none focus:ring-2 focus:ring-blue-400"
        />
      </div>
    </div>

    <div>
      <h3 class="text-lg font-medium mb-2">Attachments</h3>

      <label
        for="fileUpload"
        class="flex flex-col items-center justify-center w-full h-32 border-2 border-dashed border-gray-300 rounded-lg cursor-pointer hover:bg-gray-50 transition"
      >
        <span class="text-slate-500">
          <mat-icon class="text-blue-500 mb-1">cloud_upload</mat-icon>
        </span>
        <p class="text-blue-500 text-sm">Click to upload</p>
        <p class="text-xs text-gray-400">SVG, PNG, JPG, PDF or GIF</p>
        <input
          id="fileUpload"
          type="file"
          (change)="onFileSelected($event)"
          class="hidden"
          accept="image/*,.pdf"
          multiple
        />
      </label>

      <div class="mt-4 space-y-2">
        @for (file of attachments(); track $index) {
        <div
          class="flex items-center justify-between p-3 bg-gray-50 rounded-md mb-2"
        >
          <div class="flex items-center gap-2">
            <span class="text-blue-500">
              <mat-icon>insert_drive_file</mat-icon>
            </span>
            <div>
              <p class="text-sm font-medium">{{ file.name }}</p>
              <p class="text-xs text-gray-500">{{ file.size | number }} KB</p>
            </div>
          </div>

          <button mat-icon-button (click)="removeAttachment($index)">
            <mat-icon>delete</mat-icon>
          </button>
        </div>
        }
      </div>
    </div>
    <button
      (click)="onSubmit()"
      class="ml-auto bg-blue-500 text-white flex items-center gap-1 px-4 py-2 rounded-md hover:bg-blue-600 cursor-pointer transition-all"
    >
      <span class="text-xl">
        <ng-icon name="ionSave" />
      </span>
      {{ isLoading() ? 'Loading...' : 'Save' }}
    </button>
  </form>
</div>
