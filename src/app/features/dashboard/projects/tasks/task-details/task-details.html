<div class="p-6  text-gray-800">
  <div class="max-w-5xl mx-auto space-y-6">
    <div>
      <h1 class="text-2xl font-semibold mt-2">{{ task().title }}</h1>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
      <div class="md:col-span-2 space-y-4">
        <div class="bg-white rounded-xl shadow-sm p-4">
          <h2 class="text-lg font-semibold mb-2">Description</h2>
          <div class="">{{ task().description }}</div>
        </div>
      </div>

      <div class="bg-white rounded-xl shadow-sm p-4 space-y-2 text-sm">
        <div class="flex flex-col border-b border-slate-200 py-2">
          <span class="text-gray-500">Assignee</span>
          <span class="font-medium flex items-center gap-2">
            <img
              class="w-8 h-8 rounded-full border-2 border-white"
              src=" https://i.pravatar.cc/30?img=1"
              alt="member"
            />{{ task().assignee_id }}</span
          >
        </div>
        <div class="flex flex-col border-b border-slate-200 py-2">
          <span class="text-gray-500">Due Date</span>
          <span>{{ task().dueDate }}</span>
        </div>
        <div class="flex flex-col border-b border-slate-200 py-2">
          <span class="text-gray-500">Priority</span>
          <span
            class="priority-badge w-fit"
            [ngClass]="task().priority.toLowerCase()"
            >{{ task().priority }}</span
          >
        </div>
        <div class="flex flex-col py-2">
          <span class="text-gray-500">Status</span>
          <span
            class="status-badge w-fit"
            [ngClass]="task().status.toLowerCase().replace(' ', '-')"
            >{{ task().status }}</span
          >
        </div>
      </div>
    </div>
  </div>
</div>
