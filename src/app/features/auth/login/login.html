<div class="h-screen grid sm:grid-cols-1 lg:grid-cols-2 sm:gap-5 items-center justify-center overflow-hidden scrollbar-hide ">

     <div class="h-screen hidden lg:grid lg:grid-cols gap-0 justify-center items-center bg-blue-600/[60%] p-5 ">
            <div class="flex justify-center items-center sm:p-2 md:pl-26 md:pr-26 pb-0 mt-10">
                <img src="/assets/images/CollabSpace.png" alt="Signup"/>
            </div>
            <div class="grid gap-1 ">
                <p class="text-3xl font-bold text-center text-white">Bring Your Team's Ideas to Life</p>
                <p class="text-sm font-semibold text-black/[40%] text-center">The ultimate collaboration and project management platform to streamline your workflow and bost productivity</p>
            </div>
        </div>
    
    <div class=" h-screen grid justify-center items-center w-full">
        <div class=" m-2 grid rounded-md shadow-lg shadow-gray-400  justify-center items-center ">
            <div class="grid p-10">
                <p class="text-lg font-semibold text-gray-500 sm:text-center ">Start your journey</p>
                <p class="text-3xl font-semibold sm:text-center ">Sign up to CollabSpace</p>
            </div>
            <form [formGroup]="loginForm" (ngSubmit)="submitSignup()" class="grid gap-1 p-10 pt-0">
                <app-input-component [controlName]="loginForm.controls.email" [label]="'Email'" [type]="'email'"></app-input-component>
                <app-input-component [controlName]="loginForm.controls.password" [label]="'Password'" [type]="'password'"></app-input-component>
                
                <button type="submit" [disabled]="loginForm.invalid" [class]="loginForm.invalid ? 'w-full bg-blue-600/[40%] rounded-md p-2 mt-0 mt-2 text-black/[30%]': 'active:border-1 active:border-blue-800 text-white  font-semibold bg-blue-600/[85%] rounded-md p-2 mt-0 w-full mt-2'">
                    Sign up
                </button>
                <p class="text-center text-lg font-semibold">Already have an account?{{" "}}<span class="text-blue-700/[50%] cursor-pointer">Login</span></p>
            </form>
            </div>
        </div>
       
        
        
    </div>
