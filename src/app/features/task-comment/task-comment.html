<div class="grid gap-2 p-3 justify-start items-center bg-white">
  <div class="flex gap-3 focus:outline-blue-500/[50%]">
    <div class="text-blue-500/[90%] text-2xl">
      <ng-icon name="bootstrapPersonCircle" />
    </div>
    <div>
      <textarea
        [(ngModel)]="comment"
        placeholder="Add a comment..."
        (click)="changeDimensions(6, 80)"
        [rows]="rows()"
        [cols]="columns()"
        class="border-1 w-full text-md font-normal border-gray-500/[50%] p-2 rounded-md outline-blue-500/[50%] focus:text-black placeholder:text-gray-400"
      ></textarea>
      <div class="flex gap-2">
        @if(showButtons()){
        <button
          (click)="showComment(2, 80)"
          class="text-white font-normal bg-blue-500 rounded-md text-md p-3 hover:bg-blue-200 hover:text-black/[50%] focus:bg-blue-700 focus:text-white/[80%]"
        >
          Post
        </button>
        <button
          class="text-gray-400 font-normal rounded-md text-center text-md p-3 hover:bg-blue-200 hover:text-black/[50%] focus:bg-gray-400 focus:text-black/[50%]"
          (click)="changeDimensions(2, 80)"
        >
          Cancel
        </button>
        }
      </div>
    </div>
  </div>
</div>
