<div class="p-10">
  <div class="shadow-lg shadow-gray-400 p-5">
    <p class="text-lg font-bold">Comments</p>
    <p class="text-gray-500 text-md">Add a comment</p>

    <app-task-comment
      (commentEvent)="handleCommentFromChild($event)"
    ></app-task-comment>
    @if(isLoading()){

    <div class="flex items-center justify-center">
      <mat-spinner [diameter]="20"></mat-spinner>
    </div>
    }@else{
    <div>
      @if(isLoadingComment()){
      <div class="flex items-center gap-2 animate-pulse">
        <div class="rounded-full w-10 h-10 bg-slate-100"></div>
        <div class="w-full bg-slate-100"></div>
      </div>
      } @for(comment of comments.slice().reverse();track $index){
      <div class="grid grid-cols-reverse gap-5 p-5">
        <app-display-comments
          [comment]="comment.content"
          [date]="comment.createdAt"
          [fullName]="comment.authorName"
        ></app-display-comments>
      </div>

      }
    </div>
    }
  </div>
</div>
