<div class="p-10">
  <div class="shadow-lg shadow-gray-400 p-5">
    <p class="text-lg font-bold">Comments</p>
    <p class="text-gray-500 text-md">Add a comment</p>

    <app-task-comment
      (commentEvent)="handleCommentFromChild($event)"
    ></app-task-comment>
    @if(isLoading()){

    <div class="flex items-center justify-center">
      <mat-spinner [diameter]="20"></mat-spinner>
    </div>
    }@else if(comments.length==0){
    <div class="cursor-default">No comments to show</div>

    }@else{ @for(comment of comments.slice().reverse();track $index;let
    check=$index){ @if(!(check>5 && isHidden())){
    <div class="grid grid-cols-reverse gap-5 p-5 cursor-default">
      <app-display-comments
        [comment]="comment.content"
        [date]="comment.createdAt"
        [fullName]="comment.authorName"
      ></app-display-comments>
    </div>
    } } @if(!isHidden()==true && comments.length!==0){
    <div (click)="changeIsHidden()" class="cursor-default">Load all...</div>

    }}
  </div>
</div>
