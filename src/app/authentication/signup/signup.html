<div class="h-screen grid grid-cols-2 sm:gap-5 items-center justify-center overflow-hidden scrollbar-hide ">

     <div class=" h-screen grid grid-cols gap-0 justify-center items-center bg-blue-600/[60%] p-5 ">
            <div class="flex justify-center items-center p-5 mt-10">
                <img src="/assets/images/CollabSpace.png" alt="Signup"/>
            </div>
            <div class="grid gap-1">
                <p class="text-3xl font-bold text-center text-white">Bring Your Team's Ideas to Life</p>
                <p class="text-sm font-semibold text-black/[40%] text-center">The ultimate collaboratio and project management platform to streamline your workflow and bost productivity</p>
            </div>
        </div>
    
    <div class="grid justify-center items-center w-full sm:p-5 ">
        <div class=" grid rounded-md shadow-lg shadow-gray-300  p-5 justify-center items-center ">
            <div class="grid pb-5">
                <p class="text-lg font-semibold text-gray-500">Start your journey</p>
                <p class="text-3xl font-semibold ">Sign up to CollabSpace</p>
            </div>
            <form class="grid gap-1">
                <app-input-component [controlName]="signUpForm.controls.fullName" [label]="'Full Name'" [type]="'text'"></app-input-component>
                <app-input-component [controlName]="signUpForm.controls.email" [label]="'Email'" [type]="'email'"></app-input-component>
                <app-input-component [controlName]="signUpForm.controls.password" [label]="'Password'" [type]="'password'"></app-input-component>
                <app-input-component [controlName]="signUpForm.controls.confirmPassword" [label]="'Confirm Password'" [type]="'password'"></app-input-component>

                <button class="active:ring-2  active:ring-blue-700 mt-5 p-2 rounded-md bg-blue-600/[60%]  text-white text-lg">
                    Sign up
                </button>
            </form>
            </div>
        </div>
       
        
        
    </div>
