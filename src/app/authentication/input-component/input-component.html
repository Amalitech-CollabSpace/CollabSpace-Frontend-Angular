<div class="flex flex-col gap-1 focus: text-black active:cursor-blue-500 focus:outline-black">
    <label class="text-md font-semibold text-black">{{label}}<span class="text-red-400">*</span></label>
    <input [formControl]="controlName" required [type]="type" [placeholder]="label" class="text-sm placeholder:text-gray-400 placeholder:font-semibold w-full outline-blue-400 p-3 border-1 border-gray-600/[15%] rounded-sm text-justify"/>
    @if(controlName.invalid && (controlName.touched || controlName.dirty)
    ){
        @for(err of controlName.errors|keyvalue; track err.key){
            <p class=" text-red-700 text-sm italic mb-0">{{errorMessages[err.key]}}</p>
        }
}
</div>
